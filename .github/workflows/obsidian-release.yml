name: Release Obsidian Plugin

env:
  PLUGIN_NAME: obsidian-to-anki-plugin # Change this to match the id of your plugin.

on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - '*' # Push events to matching any tag format, i.e. 1.0, 20.15.10

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x" # You might need to adjust this value to your own version.
          cache: 'pnpm'

      # Get the version number and put it in an environment file
      - name: Get Version
        id: version
        run: |
          echo "tag=$(git describe --tags $(git rev-list --tags --max-count=1))" >> $GITHUB_ENV

      # Build the plugin
      - name: Build
        id: build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Package the required files into a zip
      - name: Package
        run: |
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css README.md ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}-${{ env.tag }}.zip ${{ env.PLUGIN_NAME }}

      # Supply-chain provenance for the built bundle (verify with
      # `gh attestation verify main.js --repo marqp/Obsidian_to_Anki`).
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'main.js, manifest.json'

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          # main.css
          generate_release_notes: true
          draft: true
          files: |
            main.js
            manifest.json
            styles.css
            ${{ env.PLUGIN_NAME }}-${{ env.tag }}.zip

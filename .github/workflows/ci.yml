name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Lint, Format, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check version sync (manifest.json is the source of truth)
        run: |
          node -e "
            const manifest = require('./manifest.json').version;
            const pkg = require('./package.json').version;
            if (manifest !== pkg) {
              console.error(\`version mismatch: manifest.json=\${manifest} package.json=\${pkg}\`);
              process.exit(1);
            }
            console.log(\`versions in sync: \${manifest}\`);
          "

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (TS 6 API for typescript-eslint compat)
        run: pnpm exec tsc6 --noEmit

      - name: Typecheck (TS 7 native)
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Check for dead code
        run: pnpm run lint:knip

      - name: Check code formatting
        run: pnpm run format:check

      - name: Run unit & regression tests
        run: pnpm test

      - name: Build plugin
        run: pnpm run build
